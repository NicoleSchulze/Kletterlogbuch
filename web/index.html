<!DOCTYPE html>
<html lang="">
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Kletterlogbuch Progressive Web App">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Kletterlogbuch">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Kletterlogbuch</title>
    <meta name="theme-color" content="#2E7D32">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="install-banner"
         style="display:none; position:fixed; bottom:20px; left:20px; background:#2196f3; color:white; padding:15px; border-radius:8px; z-index:1000;">
        <span>Installiere unsere App für schnellen Zugriff!</span>
        <button id="install-btn" style="margin-left:10px; padding:5px 10px;">Installieren</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const banner = document.getElementById('install-banner');
            const btn = document.getElementById('install-btn');
            if (!banner || !btn) return;

            let deferredPrompt;

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                banner.style.display = 'block';
            });

            btn.addEventListener('click', async () => {
                banner.style.display = 'none';
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const {outcome} = await deferredPrompt.userChoice;
                    console.log(`User response: ${outcome}`);
                    deferredPrompt = null;
                }
            });
        });
    </script>

    <script src="flutter_bootstrap.js" async></script>
</body>
</html>
