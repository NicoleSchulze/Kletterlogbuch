name: Flutter Web Deploy

on:
  push:
    branches:
      - main # Oder 'master', falls dein Haupt-Branch so heißt

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Nutzt die aktuellste stabile Version
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Application
        # Ersetze REPO_NAME durch den Namen deines GitHub-Repositories
        run: flutter build web --release --base-href "/$(basename $GITHUB_REPOSITORY)/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
